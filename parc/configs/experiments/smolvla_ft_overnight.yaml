# overnight_ft_v1 用 SmolVLA FT（学習中 eval オフ）
# eval_freq>0 だと libero init ファイル不足で落ちることがある
name: smolvla_ft_overnight
seed: 42
tags: [train, smolvla, libero_plus, overnight]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 10000
  batch_size: 4
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: lerobot_cmd
