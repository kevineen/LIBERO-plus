# thor: Evo-1 風 二段階 FT Stage2（vision unfreeze · full FT）— ユーザー承認 2026-08-04
# 前提: Stage1 done · `…72c5af3f…/005000`（薄い Lang hard SR=0.000）
# 親判定: しない · cam mix 禁止 · 薄い Language hard は親更新に使わない
# 調査メモ: docs/00_research/turbovla_evo1.md
name: sidecar_smolvla_ft_twostage_stage2_full_from_stage1_thor
seed: 42
tags: [sidecar, twostage, stage2, smolvla, language, unfreeze, from_stage1, thor]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  # Evo-1 Stage2 は長尺。ここは短め草案（10k）。延長は承認後。
  steps: 10000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/mnt/sda/parc_libero_plus/experiments/20260802T210934Z_thor_72c5af3f_sidecar_smolvla_ft_twostage_stage1_exper/train_output/checkpoints/005000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    # Stage2: フル FT（Evo-1 finetune_vlm + action head）
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=1e-5
    - --num_workers=8
    - --save_freq=2500
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  # 薄い Language hard スモーク（親決め禁止）。本格 hard×10 は別ジョブ。
  task_ids: [984, 986, 988]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
