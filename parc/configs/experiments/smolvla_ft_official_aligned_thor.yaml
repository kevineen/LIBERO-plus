# thor: 案1 — 公式 smolvla_libero の config に揃えてから FT（480幅 / Instruct VLM）
# winpc 同レシピで Gate2（SR≈0.21）達成済み。Gate3 再現 + Thor スループット確認。
# 旧 from_official_thor は expert_width 未整合で失敗したため使わない。
name: smolvla_ft_official_aligned_thor
seed: 42
tags: [train, smolvla, libero_plus, from_official, aligned, long_ft, thor]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 30000
  # thor ~124GB unified: winpc/nuc と同水準 bs=8
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=HuggingFaceVLA/smolvla_libero
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=true
    - --policy.train_expert_only=true
    - --policy.optimizer_lr=5e-5
    - --num_workers=8
    - --save_freq=10000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
