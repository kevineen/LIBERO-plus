# SmolVLA checkpoint 用のカテゴリ別 subset 評価
# worker が path を上書きする。手動時は policy.path を指定して:
#   bash scripts/eval_ckpt.sh configs/experiments/smolvla_subset_eval.yaml
name: smolvla_subset_eval
seed: 0
tags: [eval, smolvla, subset]

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  # 学習解像度に合わせる
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: checkpoint
  action_dim: 7
  device: cuda
  flip_images: true
  # worker / 手動で上書き
  path: ""
