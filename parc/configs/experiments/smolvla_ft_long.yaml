# 長時間 SmolVLA FT（overnight ckpt から resume）
# vision freeze / expert-only は LeRobot 既定のまま
name: smolvla_ft_long
seed: 42
tags: [train, smolvla, libero_plus, long_ft]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  # sweep で上書き（既定は 50k）
  steps: 50000
  batch_size: 4
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    # overnight_ft_v1_t003 @ 10k から継続
    - --policy.pretrained_path=/mnt/sda/parc_libero_plus/experiments/20260725T011626Z_overnight_ft_v1_t003/train_output/checkpoints/010000/pretrained_model
    - --policy.optimizer_lr=5e-5
    - --save_freq=10000
    - --log_freq=100

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: lerobot_cmd
