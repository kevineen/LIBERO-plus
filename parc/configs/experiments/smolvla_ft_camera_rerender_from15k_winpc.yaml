# winpc: +15k 親から camera 再レンダデモで短 FT
# データ: scripts/rerender_camera_demos.py → staging_to_lerobot.py
# 親: continue@30k +15k (厚い SR≈0.371)
name: smolvla_ft_camera_rerender_from15k_winpc
seed: 42
tags: [train, smolvla, camera, rerender, from15k, winpc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: local/libero_cam_views_v1
  dataset_root: data/datasets/libero_cam_views_v1
  policy_repo_id: null
  load_vlm_weights: true
  steps: 10000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/home/kevin/Matsuo/robot/LIBERO-plus/parc/experiments/20260728T010727Z_winpc_cb240365_smolvla_ft_continue30k_finetune15k_winpc/train_output/checkpoints/015000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=1e-5
    # cam-only: 現行 lerobot-train CLI は dataset.repo_id の配列 mix を受けない
    - --num_workers=8
    - --save_freq=2500
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: [608, 609, 610, 611, 612]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
