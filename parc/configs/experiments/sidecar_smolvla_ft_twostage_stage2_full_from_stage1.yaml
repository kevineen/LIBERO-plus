# 研究サイドカー: Evo-1 風 二段階 FT — Stage2（vision unfreeze · full FT）
# 前提: Stage1 ckpt（sidecar_smolvla_ft_twostage_stage1_*）が完了していること
# 親判定: しない · cam mix FT 禁止 · 実行は別承認（Stage1 成功後）
# 調査メモ: docs/00_research/turbovla_evo1.md
name: sidecar_smolvla_ft_twostage_stage2_full_from_stage1
seed: 42
tags: [sidecar, twostage, stage2, smolvla, language, unfreeze, from_stage1]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  # Evo-1 Stage2 は長尺。ここは短め草案。延長は承認後。
  steps: 10000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: true
  extra_args:
    # TODO(承認後): Stage1 の checkpoints/<step>/pretrained_model に差し替え
    - --policy.pretrained_path=/REPLACE_WITH_STAGE1_CKPT/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    # Stage2: フル FT（Evo-1 finetune_vlm + action head）
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=1e-5
    - --num_workers=8
    - --save_freq=2500
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: [984, 986, 988]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: lerobot_cmd
