# Phase D1 言語軸判断 — MolmoAct2 on Language hard（984/986/988）
# SmolVLA continue10k hard deep SR=0.10（984/986=0 · 988=0.30）との対照。
# 親判定・主線置換には使わない（研究サイドカー）
#
# thor: bash scripts/eval_ckpt.sh configs/experiments/molmoact2_hf_language_hard_deep_eval.yaml
name: molmoact2_hf_language_hard_deep_eval
seed: 0
tags: [eval, molmoact2, sidecar, language, hard, deep, phase_d1, thor]

eval:
  suite: libero_spatial
  num_trials_per_task: 10
  task_ids: [984, 986, 988]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  save_frames: false
  use_classification: true

policy:
  type: molmoact2
  action_dim: 7
  device: cuda
  flip_images: true
  path: allenai/MolmoAct2-LIBERO
  dtype: bfloat16
  norm_tag: libero
  num_steps: 10
  enable_cuda_graph: false
  normalize_language: true
