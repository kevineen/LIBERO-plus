# winpc: unfreeze@30k (SR≈0.57) から vision unfreeze 継続 +30k
# 勝ち筋延長。lr は 2e-5 維持。案3（厚い eval）は本ジョブ完了後に別投入。
name: smolvla_ft_official_aligned_unfreeze_continue30k_winpc
seed: 42
tags: [train, smolvla, libero_plus, from_official, aligned, unfreeze_vision, continue, long_ft, winpc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 30000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/home/kevin/Matsuo/robot/LIBERO-plus/parc/experiments/20260727T034050Z_winpc_7cb13dbc_smolvla_ft_official_aligned_unfreeze30k_/train_output/checkpoints/030000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=2e-5
    - --num_workers=8
    - --save_freq=10000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
