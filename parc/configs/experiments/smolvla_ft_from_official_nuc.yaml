# nuc: 公式起点の短め FT（overnight 系 SR=0 からの切替）。
# 公式重みは HF hub id。未取得なら初回ダウンロード。
name: smolvla_ft_from_official_nuc
seed: 42
tags: [train, smolvla, libero_plus, from_official, long_ft, nuc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 30000
  batch_size: 4
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=HuggingFaceVLA/smolvla_libero
    - --policy.optimizer_lr=5e-5
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --save_freq=10000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
