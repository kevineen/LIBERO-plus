# thor: 案2 — 互換の unfreeze@50k (SR=0.04 vanilla10) から続き学習
name: smolvla_ft_continue_unfreeze50k_thor
seed: 42
tags: [train, smolvla, libero_plus, long_ft, unfreeze_vision, continue, thor]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 30000
  # thor ~124GB unified: 将来ジョブ用に bs=8（現行 97% ジョブは触らない）
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/mnt/sda/parc_libero_plus/experiments/20260725T173541Z_long_ft_unfreeze_v1_t000/train_output/checkpoints/050000/pretrained_model
    - --policy.optimizer_lr=2e-5
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.expert_width_multiplier=0.75
    - --num_workers=8
    - --save_freq=10000
    - --log_freq=100

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
