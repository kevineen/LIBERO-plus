name: smolvla_ft_vr_demos_success_smoke
seed: 0
tags: [smolvla, ft, vr, smoke, success-only]

# 失敗混在 DS から success-only subset を作ってから学習する:
#   uv run parc-filter-demos --root data/datasets/vr_libero_demos \
#     --output data/datasets/vr_libero_demos_success --success-only --overwrite
# 失敗は分析用に元 root に残し、学習は本 YAML の success subset を使う。

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: local/vr_libero_demos_success
  dataset_root: data/datasets/vr_libero_demos_success
  steps: 200
  batch_size: 4
  num_workers: 2
