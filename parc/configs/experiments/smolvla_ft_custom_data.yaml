# 自前デモを LeRobot 形式で学習する雛形
# 1) scripts/examples/convert_demo_to_lerobot.py で data/datasets/my_panda_demos を作る
# 2) dry_run: false にして bash scripts/train.sh このファイル
# 3) できた pretrained_model を smolvla_ckpt_smoke_eval.yaml の policy.path へ
name: smolvla_ft_custom_data
seed: 42
tags: [train, smolvla, custom_data]

train:
  backend: lerobot
  policy_type: smolvla
  # Hub 上の ID（ローカルのみでもメタ用に必要）
  dataset_repo_id: local/my_panda_demos
  # 実体。parc/ からの相対 or 絶対パス
  dataset_root: data/datasets/my_panda_demos
  policy_repo_id: null
  load_vlm_weights: true
  steps: 5000
  batch_size: 2
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: true
  # LeRobot CLI へそのまま渡す追加引数
  extra_args:
    - --save_freq=1000
    - --log_freq=50
    # - --policy.optimizer_lr=1.0e-4

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: [0]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: checkpoint
  # 学習後に差し替え:
  # path: experiments/<run_id>/train_output/checkpoints/00xxxx/pretrained_model
  path: null
  device: cuda
  flip_images: true
