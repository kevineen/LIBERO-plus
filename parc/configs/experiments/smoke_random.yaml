# 最短スモーク: ランダム方策で 1 suite × 数タスク × 1 trial
name: smoke_random
seed: 0
tags: [smoke, random]

eval:
  suite: libero_spatial
  # LIBERO-plus 公式は num_trials_per_task=1
  num_trials_per_task: 1
  # スモーク用に先頭数タスクだけ
  task_ids: [0, 1, 2]
  max_steps: 50
  camera_height: 128
  camera_width: 128
  # Web UI プレビュー用（PNG シーケンス / mp4）
  save_video: false
  save_frames: false
  frame_stride: 5
  max_save_frames: 40
  # 摂動カテゴリ集計に task_classification.json を使う
  use_classification: true

policy:
  type: random
  action_dim: 7
