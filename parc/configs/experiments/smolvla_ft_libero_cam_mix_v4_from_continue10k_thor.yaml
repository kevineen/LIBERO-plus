# thor: continue10k から mix v4（base240 + hard-near cam20 ≈ 7.7%）へ短 FT +2.5k
# Phase A'（Phase B 敗北後の超保守）。cam 比率 ≤15% · lr=1e-5 · steps≤2500。
# cam = train-safe の 10_15 / 12_15 のみ（exact eval hard 11/13/14_15 は入れない）。
# 親決めは厚い + Cam deep 後。薄い smoke は親更新に使わない。
name: smolvla_ft_libero_cam_mix_v4_from_continue10k_thor
seed: 42
tags: [train, smolvla, mix, libero_plus, cam, mix_v4, phase_a_prime, short2k5, from_continue10k, thor]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: local/libero_plus_cam_mix_v4
  dataset_root: /mnt/sda/parc_libero_plus/data/datasets/libero_plus_cam_mix_v4
  policy_repo_id: null
  load_vlm_weights: true
  steps: 2500
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/mnt/sda/parc_libero_plus/experiments/imported/20260730T071018Z_winpc_cbbf5c8b_smolvla_ft_libero_cam_mix_continue10k_wi/010000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=1e-5
    - --num_workers=8
    - --save_freq=2500
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
