# winpc (RTX 4090): 公式 SmolVLA から FT。HF キャッシュへ初回ダウンロードあり。
name: smolvla_ft_from_official_winpc
seed: 42
tags: [train, smolvla, libero_plus, from_official, long_ft, winpc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 30000
  batch_size: 4
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    # HF hub id（未キャッシュなら自動取得）
    - --policy.pretrained_path=HuggingFaceVLA/smolvla_libero
    - --policy.optimizer_lr=5e-5
    - --save_freq=10000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
