# MolmoAct2 HF smoke — 1 タスク・短 horizon（Gate1）
# robot venv: bash scripts/eval_ckpt.sh configs/experiments/molmoact2_hf_smoke_eval.yaml
#
# 前提:
# - 現行 LeRobot 0.5.1 に molmoact2 無し → policy.type=molmoact2（HF predict_action）
# - 初回は allenai/MolmoAct2-LIBERO を HF から取得（数 GB）
# - RTX 4090 等では dtype=bfloat16 推奨（float32 は ~26GB）
# - 主線 SmolVLA / 親判定には接続しない（研究サイドカー）
name: molmoact2_hf_smoke_eval
seed: 0
tags: [eval, molmoact2, sidecar, smoke, gate1]

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: [0]
  max_steps: 50
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: molmoact2
  action_dim: 7
  device: cuda
  # HuggingFaceVLA/libero 慣習。掴み位置が怪しいとき false も試す
  flip_images: true
  path: allenai/MolmoAct2-LIBERO
  dtype: bfloat16
  norm_tag: libero
  num_steps: 10
  enable_cuda_graph: false
  normalize_language: true
