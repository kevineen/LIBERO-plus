# E4: num_steps=1（flow-matching 推論 steps 感度）— H4
# thor: bash scripts/eval_ckpt.sh configs/experiments/molmoact2_hf_ablate_e4_num_steps_1.yaml
name: molmoact2_hf_ablate_e4_num_steps_1
seed: 0
tags: [eval, molmoact2, sidecar, ablate, e4, num_steps_1, thor]

eval:
  suite: libero_spatial
  num_trials_per_task: 5
  task_ids: [984, 986, 988]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  save_frames: false
  use_classification: true

policy:
  type: molmoact2
  action_dim: 7
  device: cuda
  flip_images: true
  path: allenai/MolmoAct2-LIBERO
  dtype: bfloat16
  norm_tag: libero
  num_steps: 1
  enable_cuda_graph: false
  normalize_language: true
