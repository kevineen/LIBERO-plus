# E2: normalize_language=false（言語前処理が主因か）
# thor: bash scripts/eval_ckpt.sh configs/experiments/molmoact2_hf_ablate_e2_normalize_off.yaml
name: molmoact2_hf_ablate_e2_normalize_off
seed: 0
tags: [eval, molmoact2, sidecar, ablate, e2, normalize_off, thor]

eval:
  suite: libero_spatial
  num_trials_per_task: 5
  task_ids: [984, 986, 988]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  save_frames: false
  use_classification: true

policy:
  type: molmoact2
  action_dim: 7
  device: cuda
  flip_images: true
  path: allenai/MolmoAct2-LIBERO
  dtype: bfloat16
  norm_tag: libero
  num_steps: 10
  enable_cuda_graph: false
  normalize_language: false
