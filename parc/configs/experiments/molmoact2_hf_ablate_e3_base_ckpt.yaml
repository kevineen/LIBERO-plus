# E3: ベース ckpt（LIBERO FT なし）— H3
# path: allenai/MolmoAct2（非 LIBERO）。失敗大なら動作 FT が必要。
# thor: bash scripts/eval_ckpt.sh configs/experiments/molmoact2_hf_ablate_e3_base_ckpt.yaml
name: molmoact2_hf_ablate_e3_base_ckpt
seed: 0
tags: [eval, molmoact2, sidecar, ablate, e3, base_ckpt, thor]

eval:
  suite: libero_spatial
  num_trials_per_task: 5
  task_ids: [984, 986, 988]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  save_frames: false
  use_classification: true

policy:
  type: molmoact2
  action_dim: 7
  device: cuda
  flip_images: true
  path: allenai/MolmoAct2
  dtype: bfloat16
  # ベース ckpt に libero タグは無い（Allowed: franka_molmoact 等）。
  norm_tag: franka_molmoact
  num_steps: 10
  enable_cuda_graph: false
  normalize_language: true
