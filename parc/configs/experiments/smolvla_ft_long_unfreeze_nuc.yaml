# NucBox: long_ft_v1@10k から vision unfreeze で続き学習（Gate2 狙い）
name: smolvla_ft_long_unfreeze_nuc
seed: 42
tags: [train, smolvla, libero_plus, long_ft, unfreeze_vision, nuc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 50000
  batch_size: 4
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/home/kevin/Matsuo/LIBERO-plus/parc/ckpts/long_ft_v1_t001_010000/pretrained_model
    - --policy.optimizer_lr=5e-5
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --save_freq=10000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: lerobot_cmd
