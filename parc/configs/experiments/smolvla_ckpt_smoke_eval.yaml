# SmolVLA smoke checkpoint の短い LIBERO-plus 評価
# robot venv で実行: bash scripts/eval_ckpt.sh configs/experiments/smolvla_ckpt_smoke_eval.yaml
name: smolvla_ckpt_smoke_eval
seed: 0
tags: [eval, smolvla, checkpoint, smoke]

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  # 通し確認用に 1 タスク・短め horizon
  task_ids: [0]
  max_steps: 50
  # 学習データ (256) に合わせる。policy 側で 512 pad される
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: checkpoint
  action_dim: 7
  device: cuda
  flip_images: true
  path: experiments/20260724T164040Z_smolvla_ft_smoke/train_output/checkpoints/000200/pretrained_model
