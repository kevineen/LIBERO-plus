# 公式 SmolVLA (SR=0.2 spatial) から FT。overnight 系は全て SR=0 のため起点を切替。
name: smolvla_ft_from_official_thor
seed: 42
tags: [train, smolvla, libero_plus, from_official, long_ft, thor]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 50000
  batch_size: 4
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/mnt/sda/huggingface/hub/models--HuggingFaceVLA--smolvla_libero/snapshots/6721902bc4d61e50a3bfdb11dfb4cb626f05d102
    - --policy.optimizer_lr=5e-5
    - --save_freq=10000
    - --log_freq=100

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
