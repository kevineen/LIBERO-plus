# winpc: continue10k から mix v2（base120+cam60 ≈67/33）へ短 FT +5k
# Phase A reweight。lr=1e-5（失敗した 5e-6 ではなく成功系）。cam-only 禁止。
# 親決めは薄い smoke ではしない → 完了後 thor 厚い + Cam deep。
name: smolvla_ft_libero_cam_mix_v2_from_continue10k_winpc
seed: 42
tags: [train, smolvla, mix, libero_plus, cam, mix_v2, reweight, short5k, from_continue10k, winpc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: local/libero_plus_cam_mix_v2
  dataset_root: data/datasets/libero_plus_cam_mix_v2
  policy_repo_id: null
  load_vlm_weights: true
  steps: 5000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    # 親: mix continue+10k @010000（厚い 0.514 · Cam deep 0.20）
    - --policy.pretrained_path=/home/kevin/Matsuo/robot/LIBERO-plus/parc/experiments/20260730T071018Z_winpc_cbbf5c8b_smolvla_ft_libero_cam_mix_continue10k_wi/train_output/checkpoints/010000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=1e-5
    - --num_workers=8
    - --save_freq=2500
    - --log_freq=100
    - --dataset.video_backend=pyav

# 薄いスモーク（tpc=2）。親決めには使わない。完了後に thor 厚い+Cam deep。
eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
