# winpc: continue@30k (厚い eval SR≈0.31) から慎重な微調整 +15k
# lr=1e-5, vision unfreeze 継続。Camera deep eval のあと投入予定。
name: smolvla_ft_continue30k_finetune15k_winpc
seed: 42
tags: [train, smolvla, libero_plus, from_official, aligned, unfreeze_vision, continue, finetune, winpc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 15000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/home/kevin/Matsuo/robot/LIBERO-plus/parc/experiments/20260727T091901Z_winpc_ef97e24e_smolvla_ft_official_aligned_unfreeze_con/train_output/checkpoints/030000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=1e-5
    - --num_workers=8
    - --save_freq=5000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 5
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
