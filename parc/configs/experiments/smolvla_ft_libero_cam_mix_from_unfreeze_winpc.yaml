# winpc: 親=thor unfreeze@30k から libero_plus+cam mix で短 FT
# 事前: parc-mix-datasets で data/datasets/libero_plus_cam_mix_v1 を作成
# cam-only 禁止。MultiDataset 無効のため物理マージ済み単一データセットを使う。
name: smolvla_ft_libero_cam_mix_from_unfreeze_winpc
seed: 42
tags: [train, smolvla, mix, libero_plus, cam, from_unfreeze, winpc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: local/libero_plus_cam_mix_v1
  dataset_root: data/datasets/libero_plus_cam_mix_v1
  policy_repo_id: null
  load_vlm_weights: true
  steps: 10000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/home/kevin/Matsuo/robot/LIBERO-plus/parc/experiments/imported/20260727T084158Z_thor_4e89a1ad_smolvla_ft_official_aligned_unfreeze30k_/030000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=1e-5
    - --num_workers=8
    - --save_freq=2500
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: [608, 609, 610, 611, 612]
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
