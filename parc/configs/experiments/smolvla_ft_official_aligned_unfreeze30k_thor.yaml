# thor: official_aligned@30k (SR≈0.21) から vision unfreeze で +30k
# winpc 同レシピ再現（winpc で SR≈0.57）。expert-only continue (SR≈0.29) との対照。
# unfreeze 時は lr を 2e-5 に下げる。
name: smolvla_ft_official_aligned_unfreeze30k_thor
seed: 42
tags: [train, smolvla, libero_plus, from_official, aligned, unfreeze_vision, long_ft, thor]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 30000
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=/mnt/sda/parc_libero_plus/experiments/20260726T203202Z_thor_9ff610fd_smolvla_ft_official_aligned_thor/train_output/checkpoints/030000/pretrained_model
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=false
    - --policy.train_expert_only=false
    - --policy.optimizer_lr=2e-5
    - --num_workers=8
    - --save_freq=10000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
