# winpc (RTX 4090): 公式 smolvla_libero の config に揃えてから FT（480幅 / Instruct VLM）
# 失敗原因: 既定 expert_width=0.75 に 0.5 幅 ckpt を載せた size mismatch
# Resume は壊れた from_official_winpc 設定を継承するので使わない — この YAML で新規投入する
name: smolvla_ft_official_aligned_winpc
seed: 42
tags: [train, smolvla, libero_plus, from_official, aligned, long_ft, winpc]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 30000
  # RTX 4090: bs=4 で ~20/24GB・GPU util~45%。bs=8 + workers でスループット改善
  batch_size: 8
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: false
  extra_args:
    - --policy.pretrained_path=HuggingFaceVLA/smolvla_libero
    - --policy.vlm_model_name=HuggingFaceTB/SmolVLM2-500M-Instruct
    - --policy.expert_width_multiplier=0.5
    - --policy.n_action_steps=10
    - --policy.chunk_size=50
    - --policy.num_expert_layers=-1
    - --policy.num_vlm_layers=0
    - --policy.attention_mode=cross_attn
    - --policy.freeze_vision_encoder=true
    - --policy.train_expert_only=true
    - --policy.optimizer_lr=5e-5
    - --num_workers=8
    - --save_freq=10000
    - --log_freq=100
    - --dataset.video_backend=pyav

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  task_ids: null
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: true
  use_classification: true

policy:
  type: lerobot_cmd
