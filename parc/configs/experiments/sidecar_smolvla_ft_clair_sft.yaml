# 研究サイドカー: 独自/LIBERO-plus FT（Stage B 本番寄り）
name: sidecar_smolvla_ft_clair_sft
seed: 42
tags: [sidecar, clair_apo, train, smolvla, qst, loraplus]

train:
  backend: lerobot
  policy_type: smolvla
  dataset_repo_id: lerobot/libero_plus
  policy_repo_id: null
  load_vlm_weights: true
  steps: 10000
  batch_size: 2
  eval_freq: 0
  eval_n_episodes: 1
  env_task: libero_spatial
  dry_run: true
  qst: true
  lora_plus_lr_ratio: 4.0
  extra_args:
    - --policy.optimizer_lr=1e-5
    - --save_freq=2000
    - --log_freq=100

eval:
  suite: libero_spatial
  num_trials_per_task: 1
  tasks_per_category: 2
  max_steps: 280
  camera_height: 256
  camera_width: 256
  save_video: false
  use_classification: true

policy:
  type: lerobot_cmd
