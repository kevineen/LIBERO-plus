# ローカル単体スモーク用。Quest 実機接続テストでは host を 0.0.0.0 にする
# （127.0.0.1 だと WSL 外・Quest から届かない）
host: 0.0.0.0
port: 8765
suite: libero_spatial
task_id: 0
task_ids: [0]
dataset_root: /tmp/vr_smoke
repo_id: local/vr_libero_demos
fps: 20
jpeg_quality: 80
camera_height: 256
camera_width: 256
image_size: 256
flip_images: true
require_success: false
init_state_mode: cycle
operator_id: smoke_operator
device_id: fake_quest
location: lab_local
max_rtt_ms: 150
latency_policy: degraded
approx_time_slop_ms: 100
action_map:
  pos_scale: 1.0
  rot_scale: 1.0
  max_pos: 0.05
  max_rot: 0.5
