# training
n_epochs: 50
batch_size: 32
num_workers: 4
grad_clip: 100.
loss_scale: 1.0

# resume training (train.resume=true train.resume_path=/path/to/resume_latest.pth)
resume: false
resume_path: ""
debug: false

use_augmentation: true

defaults:
    - optimizer@optimizer: adam_w.yaml
    - scheduler@scheduler: cosine_annealing.yaml
