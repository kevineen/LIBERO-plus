# SmolVLA 短い FT の 2 軸スモーク（steps × seed）
# 投入: リポジトリルートで
#   export PYTHONPATH=notebooks/lib
#   uv run -m exp_orchestrator enqueue --sweep notebooks/experiments/sweeps/smolvla_lora_r_steps.yaml
# 実行: uv run -m exp_orchestrator worker --loop
name: smolvla_lora_r_steps
kind: parc
base: configs/experiments/smolvla_ft_smoke.yaml
eval_template: configs/experiments/smolvla_subset_eval.yaml
mode: grid
max_jobs: 4
seed: 42
force_dry_run: false
search:
  train.steps: [100, 200]
  seed: [42]
notes: "smoke sweep: steps and seed. Split LoRA rank into a second sweep."
disk:
  max_bytes_gb: 80
  keep_best: 5
  keep_last: 3
